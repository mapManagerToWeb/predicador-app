## Límite de memoria para este broker de desarrollo.
##
## RabbitMQ 4.x NO acepta las env RABBITMQ_VM_MEMORY_HIGH_WATERMARK* (deprecadas
## en 4.0: abortan el arranque con "deprecated environment variables detected").
## En contenedores la doc oficial recomienda valor ABSOLUTO en rabbitmq.conf:
##   https://www.rabbitmq.com/docs/memory
##
## El high-watermark es el umbral de la MEMORIA TOTAL del nodo (runtime Erlang,
## ETS, procesos, colas): al alcanzarlo el broker bloquea publishers y pagina a
## disco (flow control). 256MiB sobre un mem_limit de 768MiB deja ~500MiB al
## runtime y hace que el flow control actúe ANTES de que el OOM-killer mate el
## contenedor. Regla práctica: ~1/3 del mem_limit del contenedor.
vm_memory_high_watermark.absolute = 256MiB