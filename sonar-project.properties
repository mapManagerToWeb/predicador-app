# Configuración de SonarQube para el monorepo Angular 22 + Spring Boot 4
sonar.projectKey=predicador-app
sonar.projectName=Predicador App
sonar.projectVersion=1.0.0
sonar.projectBaseDir=.
sonar.sourceEncoding=UTF-8
sonar.working.directory=.scannerwork

# Código fuente del backend y frontend
sonar.sources=backend/shared/src/main/java,backend/config-server/src/main/java,backend/discovery-server/src/main/java,backend/api-gateway/src/main/java,backend/territory-service/src/main/java,backend/reporting-service/src/main/java,territory-frontend/src

# Rutas de pruebas (auto-detectadas por SonarQube basándose en convención de nombres)
# sonar.tests=backend/shared/src/test/java,backend/territory-service/src/test/java,backend/reporting-service/src/test/java

# Exclusiones recomendadas para evitar análisis de artefactos y dependencias
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/out/**,**/coverage/**,**/.angular/**,**/public/**,**/*.min.js,**/*.generated.*,**/src/environments/**
sonar.test.exclusions=
sonar.tests=backend/shared/src/test/java,backend/api-gateway/src/test/java,backend/territory-service/src/test/java,backend/reporting-service/src/test/java,territory-frontend/src
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Configuración Java para Spring Boot 4 / Java 25
sonar.java.source=25
sonar.java.binaries=backend/**/target/classes
sonar.java.test.binaries=backend/**/target/test-classes
sonar.junit.reportPaths=backend/shared/target/surefire-reports,backend/api-gateway/target/surefire-reports,backend/territory-service/target/surefire-reports,backend/reporting-service/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/**/target/site/jacoco/jacoco.xml

# Configuración Angular / TypeScript
sonar.javascript.file.suffixes=js,jsx
sonar.typescript.file.suffixes=ts,tsx
sonar.typescript.tsconfigPath=territory-frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=territory-frontend/coverage/lcov.info