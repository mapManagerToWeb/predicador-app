name: CI Frontend

on:
  push:
    branches: [main, chore/production-quality-hardening, feat/redesign]
    paths:
      - "territory-frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, feat/redesign]
    paths:
      - "territory-frontend/**"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: territory-frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # pnpm/action-setup instala la versión declarada en `packageManager`
      # (pnpm@9.15.0) sin depender de npm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: territory-frontend/pnpm-lock.yaml

      - name: Install dependencies
        # pnpm 9 no tiene `pnpm ci` (llegó en pnpm 11); el equivalente CI
        # es `install --frozen-lockfile`, que falla si el lockfile no está
        # sincronizado con package.json. `--ignore-scripts` evita que se
        # ejecuten lifecycle scripts de terceros durante la instalación (S6505).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Build production
        run: pnpm run build

      - name: Test
        run: pnpm test -- --run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: territory-frontend/coverage/
          retention-days: 7
