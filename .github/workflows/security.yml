name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Run OWASP dependency-check
        run: mvn org.owasp:dependency-check-maven:check -B -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 7
          if-no-files-found: ignore

  trivy:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - territory-service
          - reporting-service
          - config-server
          - discovery-server
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -t predicador/${{ matrix.service }}:scan -f ${{ matrix.service }}/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: predicador/${{ matrix.service }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      security-events: write
      contents: read
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      # Scan completo: genera SARIF con TODOS los hallazgos (no usa --error
      # para no abortar por WARNING/MEDIUM) y se sube al Code Scanning.
      - name: Run Semgrep scan (SARIF)
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/github-actions --sarif --output semgrep.sarif --metrics=off .

      - name: Upload SARIF to GitHub Advanced Security Dashboard
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      # Gate de CI: bloquea únicamente hallazgos de severidad ERROR.
      - name: Gate on ERROR findings
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/github-actions --severity ERROR --error --metrics=off .
