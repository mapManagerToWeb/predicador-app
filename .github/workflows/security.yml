name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source . --redact --exit-code=2 --verbose --config .gitleaks.toml

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: backend/owasp-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: owasp-nvd-${{ runner.os }}-
      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          AUTO_UPDATE=$([[ -n "$NVD_API_KEY" ]] && echo true || echo false)
          mvn org.owasp:dependency-check-maven:12.2.2:check -B \
            -DfailBuildOnCVSS=7 \
            -DautoUpdate=$AUTO_UPDATE \
            ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY} \
            -Ddata.directory=owasp-data
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 7

  trivy:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - territory-service
          - reporting-service
          - config-server
          - discovery-server
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -t predicador/${{ matrix.service }}:scan -f ${{ matrix.service }}/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: predicador/${{ matrix.service }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
