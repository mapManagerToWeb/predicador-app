name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Run OWASP dependency-check
        run: mvn org.owasp:dependency-check-maven:check -B -DfailBuildOnCVSS=7
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 7

  trivy:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - territory-service
          - reporting-service
          - config-server
          - discovery-server
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        working-directory: backend
        run: docker build -t predicador/${{ matrix.service }}:scan -f ${{ matrix.service }}/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: predicador/${{ matrix.service }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
