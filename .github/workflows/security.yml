name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check -B -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 7

  trivy:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - territory-service
          - reporting-service
          - config-server
          - discovery-server
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        working-directory: backend
        run: docker build -t predicador/${{ matrix.service }}:scan -f ${{ matrix.service }}/Dockerfile .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: predicador/${{ matrix.service }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      security-events: write
      contents: read
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      # Scan completo: genera SARIF con TODOS los hallazgos (no usa --error
      # para no abortar por WARNING/MEDIUM) y se sube al Code Scanning.
      - name: Run Semgrep scan (SARIF)
        run: semgrep scan \
          --config p/security-audit \
          --config p/owasp-top-ten \
          --config p/github-actions \
          --sarif \
          --output semgrep.sarif \
          --metrics=off \
          .

      - name: Upload SARIF to GitHub Advanced Security Dashboard
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      # Gate de CI: bloquea únicamente hallazgos de severidad ERROR.
      # (No vuelve a emitir SARIF; --severity ERROR filtra también el output.)
      - name: Gate on ERROR findings
        run: semgrep scan \
          --config p/security-audit \
          --config p/owasp-top-ten \
          --config p/github-actions \
          --severity ERROR \
          --error \
          --metrics=off \
          .
