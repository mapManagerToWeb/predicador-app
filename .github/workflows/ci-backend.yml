name: CI Backend

on:
  push:
    branches: [main, chore/production-quality-hardening, feat/redesign]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, feat/redesign]
    paths:
      - "backend/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend-test

      - name: Build and test all modules
        run: mvn verify -B

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/
          retention-days: 7
