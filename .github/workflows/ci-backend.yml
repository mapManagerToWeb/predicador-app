name: CI Backend

on:
  push:
    branches: [main, chore/production-quality-hardening]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: predicador
          POSTGRES_PASSWORD: test
          POSTGRES_DB: predicador_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test all modules
        env:
          DB_URL: jdbc:postgresql://localhost:5432/predicador_test
          DB_USERNAME: predicador
          DB_PASSWORD: test
        run: mvn verify -B

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/
          retention-days: 7
