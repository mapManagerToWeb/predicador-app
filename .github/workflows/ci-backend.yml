name: CI Backend

on:
  push:
    branches: [main, chore/production-quality-hardening]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: predicador
          POSTGRES_PASSWORD: test
          POSTGRES_DB: predicador_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and test all modules
        env:
          DB_URL: jdbc:postgresql://localhost:5432/predicador_test
          DB_USERNAME: predicador
          DB_PASSWORD: test
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock
        run: mvn verify -Pcoverage -B

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/
          retention-days: 7
          if-no-files-found: error

  backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # El job necesita el árbol del repo: la llave pública de cifrado vive en .github/backup/age.pub
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age

      - name: Dump and encrypt Neon database
        env:
          PGDATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          FILE="predicador-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
          # El dump en claro nunca debe sobrevivir: se limpia también si falla el cifrado
          trap 'rm -f "$FILE"' EXIT
          pg_dump "$PGDATABASE_URL" | gzip > "$FILE"
          gzip -t "$FILE"
          age -e -R .github/backup/age.pub -o "$FILE.age" "$FILE"
          rm -f "$FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-backup-${{ github.run_id }}
          path: predicador-backup-*.sql.gz.age
          retention-days: 30
