# Intermediario de solo lectura entre el gateway y Docker (panel «Sistema»).
#
# Quien controla el socket de Docker controla todo el servidor, así que el
# gateway nunca lo toca: habla con este HAProxy, que solo deja pasar GET a la
# lista de contenedores y a su consumo de memoria. Todo lo demás se rechaza:
# encender, apagar, ejecutar comandos y, sobre todo, «inspect»
# (/containers/<id>/json), que mostraría las variables de entorno con las
# contraseñas de cada servicio.
global
  log stdout format raw local0 warning

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend lectura
  bind :2375
  acl solo_lectura method GET
  acl lista path_reg ^(/v[0-9.]+)?/containers/json$
  acl consumo path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/stats$
  http-request deny deny_status 403 unless solo_lectura
  http-request deny deny_status 403 unless lista or consumo
  default_backend docker

backend docker
  server socket /var/run/docker.sock
