spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 30000
    peer-node-read-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
