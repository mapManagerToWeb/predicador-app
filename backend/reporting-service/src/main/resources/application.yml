spring:
  application:
    name: reporting-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predicador}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: never
  jpa:
    defer-datasource-initialization: true
    hibernate:
      # Ver comentario en territory-service: Hibernate gestiona el schema.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  session:
    # Debe ser >= 32 bytes de entropía real. Si queda vacío, los tokens
    # no se emiten (modo compatibilidad hacia atrás durante despliegue).
    secret: ${SESSION_SECRET:}
    ttl-hours: ${SESSION_TTL_HOURS:12}

whatsapp:
  api-version: "v21.0"
  base-url: "https://graph.facebook.com"
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  template-name: ${WHATSAPP_TEMPLATE:}
  language-code: ${WHATSAPP_LANG:es_CL}
  destination-number: ${WHATSAPP_DESTINATION:}
