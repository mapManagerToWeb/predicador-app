server:
  port: 8082

management:
  server:
    port: 8092
  health:
    # Desactivar DataSourceHealthIndicator para que los health checks no
    # ejecuten SELECT 1 contra la DB, lo que abriría conexiones y mantendría
    # Neon despierto.
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: reporting-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Usar /actuator/info en vez de /actuator/health para evitar que Eureka
    # abra conexiones a la DB en cada heartbeat (cada 30s), lo que impide
    # que Neon suspenda compute.
    health-check-url-path: /actuator/info

otel:
  service:
    name: reporting-service
  traces:
    exporter: none
  logs:
    exporter: none
  metrics:
    exporter: none

---
# Profile: observability — enables OTLP trace export to collector.
spring:
  config:
    activate:
      on-profile: observability
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}
      protocol: http/protobuf
  traces:
    exporter: otlp

---
# Profile: prod — conservative sampling, stricter health details.
spring:
  config:
    activate:
      on-profile: prod
management:
  tracing:
    sampling:
      probability: 0.1
  endpoint:
    health:
      show-details: never

app:
  session:
    secret: ${SESSION_SECRET:}
    ttl-hours: ${SESSION_TTL_HOURS:12}
    strict: ${SESSION_STRICT:true}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}

whatsapp:
  api-version: "v21.0"
  base-url: "https://graph.facebook.com"
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:-}
  template-name: ${WHATSAPP_TEMPLATE:-asignacion_territorio}
  language-code: ${WHATSAPP_LANG:es_CL}
  destination-number: ${WHATSAPP_DESTINATION:}
