spring:
  application:
    name: reporting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predicador}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 1
      idle-timeout: 30000
      maximum-pool-size: 3
      max-lifetime: 300000
  jpa:
    hibernate:
      # Flyway gestiona el esquema; `none` evita que Hibernate valide antes de
      # que Flyway migre (Spring Boot 4 crea el EntityManagerFactory primero).
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    # Tabla de historial propia: territory-service y reporting-service comparten
    # base de datos (Neon) pero versionan sus migraciones por separado. Sin esta
    # tabla dedicada, las migraciones de reporting colisionarían con las de territory.
    table: flyway_schema_history_reporting
    # Conexión directa (sin -pooler): Flyway necesita operaciones de sesión que
    # PgBouncer en modo transacción no soporta (prepared statements, SET, DDL).
    url: ${DB_URL_UNPOOLED:${DB_URL:jdbc:postgresql://localhost:5432/predicador}}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Usar /actuator/info en vez de /actuator/health para evitar que Eureka
    # abra conexiones a la DB en cada heartbeat (cada 30s), lo que impide
    # que Neon suspenda compute.
    health-check-url-path: /actuator/info

management:
  health:
    # Desactivar DataSourceHealthIndicator para que los health checks no
    # ejecuten SELECT 1 contra la DB, lo que abriría conexiones y mantendría
    # Neon despierto.
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: reporting-service
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

otel:
  service:
    name: reporting-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}
      protocol: http/protobuf
  logs:
    exporter: none
  metrics:
    exporter: none

app:
  session:
    secret: ${SESSION_SECRET}
    ttl-hours: ${SESSION_TTL_HOURS:12}
    strict: ${SESSION_STRICT:true}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}

whatsapp:
  api-version: "v21.0"
  base-url: "https://graph.facebook.com"
  phone-number-id: ${WHATSAPP_PHONE_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  template-name: ${WHATSAPP_TEMPLATE:}
  language-code: ${WHATSAPP_LANG:es_CL}
  destination-number: ${WHATSAPP_DESTINATION:}

---
# Profile: local — explicitly permits an unset session secret for local-only use.
spring:
  config:
    activate:
      on-profile: local
app:
  session:
    secret: ${SESSION_SECRET:}
    strict: false
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
