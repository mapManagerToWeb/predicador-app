spring:
  application:
    name: territory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predicador}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # minimum-idle: 0 permite que el pool se vacíe cuando no hay tráfico.
      # Con minimum-idle > 0, el HouseKeeper de HikariCP (cada 30s) recrea la
      # conexión proactivamente, despertando el compute de Neon (scale-to-zero)
      # en un ciclo continuo que consume CU-hours del plan free.
      minimum-idle: 0
      idle-timeout: 30000
      # Pool 6 + connection-timeout 15s: absorbe la ráfaga de requests que
      # llegan juntos tras el scale-to-zero de Neon (reanudar el compute tarda
      # segundos). Con 3 conexiones la ráfaga agotaba el pool -> 500/503
      # intermitentes tras inactividad. min-idle 0 + idle-timeout 30s siguen
      # dejando dormir el compute cuando no hay tráfico (CU-hours free plan).
      maximum-pool-size: 6
      max-lifetime: 300000
      connection-timeout: 15000
      keepalive-time: 0
  jpa:
    hibernate:
      # Flyway gestiona el esquema; `none` evita que Hibernate valide antes de
      # que Flyway migre (Spring Boot 4 crea el EntityManagerFactory primero).
      ddl-auto: none
    # Evita mantener el EntityManager abierto durante el renderizado de vistas,
    # lo que retendría conexiones del pool y mantendría el compute de Neon activo.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    # Historial propio: territory y reporting comparten la BD pero versionan
    # sus migraciones por separado para no colisionar en la misma tabla.
    table: flyway_schema_history_territory
    # Conexión directa (sin -pooler): Flyway necesita operaciones de sesión que
    # PgBouncer en modo transacción no soporta (prepared statements, SET, DDL).
    url: ${DB_URL_UNPOOLED:${DB_URL:jdbc:postgresql://localhost:5432/predicador}}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    # Usar /actuator/info en vez de /actuator/health para evitar que Eureka
    # abra conexiones a la DB en cada heartbeat (cada 30s), lo que impide
    # que Neon suspenda compute.
    health-check-url-path: /actuator/info

app:
  session:
    secret: ${SESSION_SECRET}
    ttl-hours: ${SESSION_TTL_HOURS:12}
    strict: ${SESSION_STRICT:true}

management:
  health:
    # Desactivar DataSourceHealthIndicator para que los health checks no
    # ejecuten SELECT 1 contra la DB, lo que abriría conexiones y mantendría
    # Neon despierto.
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: territory-service
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

otel:
  service:
    name: territory-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}
      protocol: http/protobuf
  logs:
    exporter: none
  metrics:
    exporter: none

---
# Profile: local — explicitly permits an unset session secret for local-only use.
spring:
  config:
    activate:
      on-profile: local
app:
  session:
    secret: ${SESSION_SECRET:}
    strict: false
