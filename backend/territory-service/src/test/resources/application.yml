spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  tiles:
    max-zoom: 19
    s2-level: 14
    s2-z-min: 12
    extent: 4096
    buffer: 64
    cache-max-size: 5000
    cache-ttl: 10m
