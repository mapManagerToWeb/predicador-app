spring:
  application:
    name: territory-service
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predicador}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  cache:
    type: caffeine
    cache-names:
      - territory-numbers
      - geojson-all
      - geojson-one
      - territory-colors
    metrics:
      enabled: true
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Hibernate sigue gestionando el schema hoy. Flyway se encarga sólo de
      # migraciones incrementales versionadas (índices, etc.). Migrar a
      # ddl-auto: validate + un V1__baseline.sql real es un paso posterior.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    # Permite adoptar Flyway sobre una base que ya existe (Hibernate creó el
    # schema previamente). Con baseline-version=0 los V1 actuales se aplican.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Compatibilidad con Postgres 16+: fuerza el driver moderno de Flyway.
    validate-on-migrate: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

app:
  session:
    # Debe coincidir con api-gateway y reporting-service. Si queda vacío,
    # SessionAuthFilter arranca en modo compatibilidad (no aplica enforcement).
    secret: ${SESSION_SECRET:}
    ttl-hours: ${SESSION_TTL_HOURS:12}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: territory-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

otel:
  service:
    name: territory-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
      protocol: http/protobuf
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  logs:
    exporter: none
  metrics:
    exporter: none

---
# Profile: observability — enables OTLP trace export to collector.
# Activate with SPRING_PROFILES_ACTIVE=observability or OTEL_TRACES_EXPORTER=otlp.
spring:
  config:
    activate:
      on-profile: observability
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
otel:
  traces:
    exporter: otlp

---
# Profile: prod — conservative sampling, stricter health details.
spring:
  config:
    activate:
      on-profile: prod
management:
  tracing:
    sampling:
      probability: 0.1
  endpoint:
    health:
      show-details: never
