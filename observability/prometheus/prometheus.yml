# Prometheus scrape config for Predicador backend services.
#
# Each Spring Boot service exposes /actuator/prometheus on a dedicated
# management port (not the main application port). This keeps actuator
# endpoints off the public-facing port and aligns with the gateway's
# ActuatorAccessFilter defense-in-depth.
#
# Metrics are tagged with `application=<service>` via management.metrics.tags
# so every dashboard variable can filter by service.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: predicador

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8090']
        labels:
          application: api-gateway

  - job_name: territory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['territory-service:8091']
        labels:
          application: territory-service

  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['reporting-service:8092']
        labels:
          application: reporting-service

  # Self-monitoring: Prometheus scrapes itself so we can alert on cardinality
  # explosions or missed scrapes.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
