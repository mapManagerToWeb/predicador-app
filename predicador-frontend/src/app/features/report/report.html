<div class="report-panel">
  <div class="option-group">
    <label class="option-label">Horario</label>
    <div class="radio-group">
      <button
        class="radio-btn"
        [class.active]="horario() === 'morning'"
        (click)="horario.set('morning')"
      >
        Mañana
      </button>
      <button
        class="radio-btn"
        [class.active]="horario() === 'afternoon'"
        (click)="horario.set('afternoon')"
      >
        Tarde
      </button>
    </div>
  </div>
</div>
