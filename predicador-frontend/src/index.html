<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Predicador</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Aplicación para encargados de grupos de predicación" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      Warm up TCP + TLS to the tile providers antes de que MapPage se hidrate.
      preconnect es más caro que dns-prefetch pero se paga una sola vez y
      elimina ~200-400ms del primer tile visible en móviles.
      Los subdominios de OSM y CartoDB rotan (a/b/c/d), pero el handshake se
      reutiliza con HTTP/2 por origen efectivo.
    -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Por favor habilitá JavaScript para usar esta aplicación.</noscript>
  </body>
</html>
