<div class="auth-shell">
  <div class="auth-scroll">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <img src="logo.jpeg" alt="Territory Logo" width="48" height="48" loading="lazy" />
        </div>
        <h1>Territory</h1>
        <p class="tagline">Gestion de territorios</p>
      </div>

      <div class="auth-body">
        <p class="section-label">Inicia sesion con tu telefono</p>

        <div class="field">
          <label for="telefono">Telefono</label>
          <div class="input-phone">
            <span class="prefix">+56</span>
            <input
              id="telefono"
              type="tel"
              inputmode="numeric"
              [value]="telefono()"
              (input)="onTelefonoInput($event)"
              (keyup.enter)="login()"
              placeholder="9 1234 5678"
              [disabled]="loading()"
              autocomplete="tel"
            />
          </div>
        </div>

        @if (pinRequerido()) {
          <div class="field">
            <label for="pin">PIN</label>
            <input
              id="pin"
              type="password"
              inputmode="numeric"
              maxlength="8"
              [value]="pin()"
              (input)="onPinInput($event)"
              (keyup.enter)="login()"
              placeholder="Tu PIN de 6 dígitos"
              [disabled]="loading()"
              autocomplete="current-password"
            />
            <p class="field-hint">Te lo da el administrador. Si lo perdiste, pedile uno nuevo.</p>
          </div>
        }

        <button
          class="btn-primary"
          (click)="login()"
          [disabled]="!telefono() || (pinRequerido() && pin().length < 4) || loading()"
        >
          @if (loading()) {
            <span class="spinner"></span>
            <span>Conectando...</span>
          } @else {
            <span>Conectar</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          }
        </button>
      </div>

      <a class="auth-visor" routerLink="/visor">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/>
          <path d="M9 4v14M15 6v14"/>
        </svg>
        Ver territorios sin iniciar sesión
      </a>

      <div class="auth-footer">
        <span>No tienes cuenta?</span>
        <a routerLink="/profile">Crear perfil</a>
      </div>
    </div>
  </div>
</div>
