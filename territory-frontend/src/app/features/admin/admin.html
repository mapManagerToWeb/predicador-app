@if (!isLoggedIn()) {
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <img src="logo.jpeg" alt="Territory Logo" width="56" height="56" loading="lazy" />
        </div>
        <h1>Panel de Administrador</h1>
        <p class="subtitle">Ingresá tus credenciales</p>
      </div>

      <form class="login-body" (submit)="$event.preventDefault(); login()">
        <div class="form-group">
          <label for="user">Usuario</label>
          <input
            id="user"
            type="text"
            [value]="username()"
            (input)="onUsernameInput($event)"
            placeholder="Usuario"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="pass">Contraseña</label>
          <input
            id="pass"
            type="password"
            [value]="password()"
            (input)="onPasswordInput($event)"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
        </div>

        @if (loginError()) {
          <div class="error-msg" role="alert">Credenciales incorrectas</div>
        }

        <button class="login-btn" type="submit" [disabled]="logging()">
          @if (logging()) {
            <span class="spinner"></span>
            <span>Ingresando...</span>
          } @else {
            <span>Ingresar</span>
          }
        </button>
      </form>
    </div>
  </div>
} @else {
  <div class="adm adm-layout">
    <nav class="adm-sidebar" aria-label="Secciones del panel">
      <div class="adm-brand">
        <img src="logo.jpeg" alt="" width="32" height="32" />
        <span>Administración</span>
      </div>
      @for (s of secciones; track s.ruta) {
        <a class="adm-nav" [routerLink]="s.ruta" routerLinkActive="activo" [attr.aria-label]="s.titulo">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path [attr.d]="s.icono" /></svg>
          <span>{{ s.titulo }}</span>
        </a>
      }
      <div class="adm-sidebar-foot">
        <button class="adm-nav" type="button" (click)="alternarTema()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
          <span>{{ oscuro() ? 'Tema claro' : 'Tema oscuro' }}</span>
        </button>
        <button class="adm-nav" type="button" (click)="goToMap()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Zm0-9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
          </svg>
          <span>Ir al mapa</span>
        </button>
        <button class="adm-nav" type="button" (click)="logout()">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9" />
          </svg>
          <span>Salir</span>
        </button>
      </div>
    </nav>

    <main class="adm-main">
      <router-outlet />
    </main>

    @if (ui.confirmacion(); as c) {
      <div class="adm-overlay" tabindex="-1" (click)="cerrarSiFondo($event)" (keydown.escape)="responder(false)">
        <div
          class="adm-dialog"
          role="alertdialog"
          aria-modal="true"
          [attr.aria-label]="c.titulo"
        >
          <h2>{{ c.titulo }}</h2>
          <p>{{ c.mensaje }}</p>
          @if (c.escribir) {
            <label class="adm-field">
              <span>Para confirmar, escribí <strong>{{ c.escribir }}</strong></span>
              <input type="text" [value]="textoConfirmacion()" (input)="onTextoConfirmacion($event)" />
            </label>
          }
          <div class="adm-actions">
            <button class="adm-btn" type="button" (click)="responder(false)">Cancelar</button>
            <button
              class="adm-btn"
              type="button"
              [class.primary]="!c.peligro"
              [class.danger]="c.peligro"
              [disabled]="!!c.escribir && textoConfirmacion().trim() !== c.escribir"
              (click)="responder(true)"
            >
              {{ c.accion }}
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
