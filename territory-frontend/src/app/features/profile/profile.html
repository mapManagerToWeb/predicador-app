<div class="auth-shell">
  <div class="auth-scroll">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <img src="logo.jpeg" alt="" width="72" height="72" />
        </div>
        <h1>Crea tu perfil</h1>
        <p class="tagline">Escribe tu nombre y tu teléfono</p>
      </div>

      <div class="auth-body">
        <div class="field">
          <label for="name">Nombre</label>
          <input
            id="name"
            type="text"
            [value]="name()"
            (input)="onNameInput($event)"
            placeholder="Tu nombre"
            autocomplete="given-name"
          />
        </div>
        <div class="field">
          <label for="lastName">Apellido</label>
          <input
            id="lastName"
            type="text"
            [value]="lastName()"
            (input)="onLastNameInput($event)"
            placeholder="Tu apellido"
            autocomplete="family-name"
          />
        </div>

        <div class="field">
          <label for="telefono">Teléfono</label>
          <div class="input-phone">
            <span class="prefix">+56</span>
            <input
              id="telefono"
              type="tel"
              inputmode="numeric"
              [value]="telefono()"
              (input)="onTelefonoInput($event)"
              placeholder="9 1234 5678"
              autocomplete="tel"
              [attr.aria-invalid]="errorTelefono() ? 'true' : null"
              aria-describedby="telefono-error"
            />
          </div>
          @if (errorTelefono(); as error) {
            <p id="telefono-error" class="field-error" role="alert">{{ error }}</p>
          }
        </div>

        <button
          class="btn-primary"
          (click)="save()"
          [disabled]="!name() || !lastName() || !telefono() || loading()"
        >
          @if (loading()) {
            <span class="spinner"></span>
            <span>Guardando…</span>
          } @else {
            <span>Crear mi perfil</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          }
        </button>
      </div>

      <div class="auth-footer">
        <span>¿Ya tienes cuenta?</span>
        <a routerLink="/login">Entrar</a>
      </div>
    </div>
  </div>
</div>
