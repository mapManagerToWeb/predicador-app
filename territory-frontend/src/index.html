    <meta name="theme-color" content="#3b82f6" />

    <!--
      Warm up TCP + TLS to the tile provider antes de que MapPage se hidrate.
      El handshake de OSM se reutiliza con HTTP/2 para los subdominios a/b/c.
      CartoDB y ArcGIS (modos oscuro / satélite) solo se usan si el usuario
      cambia de capa: un preconnect activo allí es caro sin beneficio inmediato,
      así que solo hacemos dns-prefetch.
    -->
