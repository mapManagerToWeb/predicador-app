<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Territorios</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Barra de arriba del teléfono: del color de la app (COLOR_BARRA en core/utils/tema.ts la cambia con el tema). -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- «default»: hora y batería en negro sobre claro. Con «black-translucent» salían blancas sobre la pantalla blanca. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Quien eligió el tema oscuro lo ve desde el primer instante, sin un destello blanco al abrir. -->
    <script>
      try {
        if (localStorage.getItem('territory_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090b');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Aplicación para encargados de grupos de territorios" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Territorios" />
    <link rel="manifest" href="site.webmanifest" />
    <!-- La letra (Inter) viaja con la app: no depende de Google ni de la señal, y el texto no «salta» al cargar. -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />
  </head>
  <!-- ontouchstart vacío: sin él, Safari de iPhone no aplica :active (el botón que se hunde al tocarlo). -->
  <body ontouchstart="">
    <app-root></app-root>
    <noscript>Por favor habilita JavaScript para usar esta aplicación.</noscript>
  </body>
</html>
