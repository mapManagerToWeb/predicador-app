services:
  config-server:
    build:
      context: ./backend
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://localhost:5432/predicador}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # El config-server materializa placeholders como ${SESSION_SECRET} en
      # los YAML servidos. Pasar el valor aquí es lo que hace que los servicios
      # downstream (gateway, reporting, territory) reciban el secret propagado.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - SESSION_STRICT=${SESSION_STRICT:-true}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      # Igual con las credenciales admin, que hoy se resuelven al arrancar el
      # gateway pero el config-server también las sirve como overlay opcional.
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PASSWORD_BCRYPT=${ADMIN_PASSWORD_BCRYPT:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-server:
    build:
      context: ./backend
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    expose:
      - "8090"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      # BCrypt es obligatorio fuera de local; plaintext sólo se usa con perfil local.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PASSWORD_BCRYPT=${ADMIN_PASSWORD_BCRYPT:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      # HMAC secret compartido con reporting-service para emitir/verificar tokens.
      # El secret es obligatorio para evitar iniciar servicios sin enforcement.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      # OpenTelemetry: los exporters OTLP estan deshabilitados por defecto.
      # Para activar tracing con el colector, levantar con el perfil observability
      # y exportar en el shell del host:
      #   export OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      #   export OTEL_TRACES_EXPORTER=otlp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  territory-service:
    build:
      context: ./backend
      dockerfile: territory-service/Dockerfile
    container_name: territory-service
    ports:
      - "8081:8081"
    expose:
      - "8091"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - DB_URL=${DB_URL:-jdbc:postgresql://localhost:5432/predicador}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Debe coincidir con el api-gateway y reporting-service: mismo HMAC
      # secret para poder verificar los tokens que emiten los otros servicios.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reporting-service:
    build:
      context: ./backend
      dockerfile: reporting-service/Dockerfile
    container_name: reporting-service
    ports:
      - "8082:8082"
    expose:
      - "8092"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - DB_URL=${DB_URL:-jdbc:postgresql://localhost:5432/predicador}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-1194956653707331}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_TEMPLATE=${WHATSAPP_TEMPLATE:-asignacion_territorio}
      - WHATSAPP_DESTINATION=${WHATSAPP_DESTINATION:-56936577203}
      # Debe coincidir con el api-gateway para que los tokens que éste emite
      # sean verificables aquí cuando activemos enforcement server-side.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Observability stack. Activado con:
  #   docker-compose --profile observability up -d
  #
  # No arranca por defecto para no gastar RAM en desarrollo cotidiano.
  # Puertos expuestos:
  #   - Prometheus  :9090
  #   - Grafana     :3000  (admin / admin)
  #   - Jaeger UI   :16686
  #   - OTel Collector debug metrics :8888 (colisiona con config-server; usa red interna)
  # --------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otel-collector
    profiles: [observability]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (opcional para clientes externos)
      - "4318:4318"   # OTLP HTTP (usado por los servicios Spring Boot)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    profiles: [observability]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # legacy thrift receiver (no lo usamos, sólo por compat)

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    profiles: [observability]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
